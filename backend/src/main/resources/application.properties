spring.application.name=event-enrollment-system
server.port=${PORT:${SERVER_PORT:8081}}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_enrollment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.admin-password=${ADMIN_PASSWORD:Admin123!}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

